[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "min_quant"
version = "0.1.0"
description = "A modular quant trading system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask==3.1.2",
    "ipykernel>=7.3.0",
    "joblib==1.5.3",
    "loguru==0.7.2",
    "matplotlib==3.10.8",
    "numpy==2.5.1",
    "pandas==3.0.2",
    "pandas-stubs~=3.0.2",
    "pyarrow==25.0.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "PyYAML==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.16.3",
    "tushare==1.4.24",
    "typer==0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
markers = [
    "contract: requires a provisioned external contract dependency",
]
